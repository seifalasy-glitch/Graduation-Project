# Used only by tests (@ActiveProfiles("test")). Fills the settings that
# application.properties reads from env vars, so tests run on any laptop.
# Values are fake on purpose: starting the app sends no email.
# The database comes from TestcontainersConfiguration, not from here.

spring.datasource.username=test
spring.datasource.password=test

app.jwt.secret=test-only-jwt-secret-at-least-32-characters-long

spring.mail.username=test@example.com
spring.mail.password=test
