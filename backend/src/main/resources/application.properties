spring.application.name=edusync-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/edusync_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway: on startup, runs the db/migration/V*.sql files this database has not run yet.
# A database that already has tables but no Flyway history (made from the old dump)
# is marked as V1 and only gets V2, V3...; an empty database runs everything from V1.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.port=8080

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=28800000


# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.default-encoding=UTF-8


app.frontend.url=${FRONTEND_URL:http://localhost:3000}

app.university-email-domain=${UNIVERSITY_EMAIL_DOMAIN:sci.asu.edu.eg}

spring.servlet.multipart.max-file-size=10MB
server.tomcat.max-swallow-size=-1
spring.servlet.multipart.max-request-size=10MB
