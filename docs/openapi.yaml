openapi: 3.0.3

info:
  title: EduSync API
  version: 1.0.0-draft
  description: |
    API contract between the React frontend and the Spring Boot backend.
    Built from the final ER diagram (36 tables).

    HOW TO READ THIS FILE
    - Every endpoint lists who may call it in `x-roles`.
      Roles: STUDENT, DOCTOR, ADMIN (a admin manages the system).
      One user can have more than one role (table USER_ROLE).
    - Every endpoint except login needs the header `Authorization: Bearer <token>`.
    - The backend enforces roles AND ownership on every request
      (a doctor only touches groups they teach, a student only sees their own data).
      Hiding a button in React is a convenience, not security.
    - Every error has the same shape: { "code": "...", "message": "..." }.
    - Blank mark = "not graded yet" (JSON null). 0 = a real zero.
    - Final-exam marks are NOT part of EduSync.

    DECIDED
    - Login: university email + password. Accounts are created by a admin with a
      temporary password; on first login the user MUST create a new password
      (USER.must_change_password). Passwords are stored only as a hash (BCrypt).
    - Attendance statuses: PRESENT, LATE and ABSENT. Unmarked = null.
    - QR code rotates every 15 seconds (backend setting `attendance.qr-rotation-seconds`).
    - The QR window end is stored in ATTENDANCE_SESSION.qr_window_ends_at.
    - Login token lasts 8 hours. No refresh token: after 8 hours the user logs in again.
    - Ticket status: OPEN, IN_PROGRESS, RESOLVED. Ticket decision: ACCEPTED, REJECTED.
    - Enrollment status: ACTIVE, WITHDRAWN, COMPLETED.
    - Teaching assistants use the DOCTOR role, with the same permissions.
    - Uploads (materials, submissions): PDF only, at most 10 MB.
    - Passwords: at least 8 characters with an uppercase letter, a lowercase
      letter, a digit and a symbol.
    - Grade emails are in English; see POST /grade-sends for the template.
    - Control-office file: SeatNo, StudentNameAr, one total ClassWork column
      (see POST /control-exports). ENROLLMENT.seat_no and USER.full_name_ar added.
    - Attendance warnings are optional: the doctor turns them on per course,
      separately for lectures and for labs (practicals), and sets the limit
      (number of absences). Students who reach it get an email; the department
      gets one PDF list per course (see /attendance-warnings/report).

    - Students see a mark only after the doctor SENDS it (STUDENT_GRADE.published_score).
    - Students and enrollments can be imported in bulk from Excel (preview, then commit).
    - No login lockout. Forgotten passwords: self-service email reset (30-minute single-use link).
    - Attendance can be LATE: the doctor sets "late after X minutes" per session;
      for absence warnings every 2 LATE = 1 absence, and a student still unmarked
      when the session is finished counts as absent.
    - Attendance grade (built with the grades module): per course and per group type
      the doctor sets a total attendance grade (lectures: optional, labs: always).
      grade = total x attended / sessions actually held; LATE counts half;
      a student still unmarked when the session is finished counts as absent.
    - LOCAL_WIFI_QR "in the room" check = the student's IP address must be inside the
      room's subnet (e.g. 10.20.5.0/24). A browser cannot report the Wi-Fi SSID or
      router MAC, so those are stored on the room but not checked.
    - Course registration: students pick courses from their program plan (by level and
      term type) within their personal credit limit; their advisor (a doctor) approves,
      then an admin gives final acceptance, which creates the enrollments.
    - Groups (lecture / lab) are managed by the course's doctor; doctors are linked per group.
      Setup order for a new offering: the admin creates its first group and assigns the
      doctor to it (POST /groups/{groupId}/teaching-assignments). After that, the doctor
      can create and manage the other groups of the course.
    - A DISABLED student can't get new enrollments; enrollments made before the account
      was disabled are kept.
    - Grade import: ONE Excel file with all students and a Department column; the backend
      splits it by program. Approve first, then review and send the emails.
    - Not in EduSync: quizzes, ticket chat threads / inbox, final-exam marks, letter grades,
      rubrics, profile photos and user preferences. Profile name/email are set by the admin.

    HTTP STATUS RULE FOR ERRORS (same meaning everywhere)
    - 400: the request data is invalid (VALIDATION_ERROR, MISSING_FIELD, WEAK_PASSWORD...).
      `details` says which field.
    - 403: you may not do this (wrong role, NOT_YOUR_COURSE, NOT_YOUR_ADVISEE...).
    - 404: the record does not exist, or you are not allowed to see it (*_NOT_FOUND).
    - 409: the request is valid but the current state blocks it: it already exists
      (*_EXISTS, ALREADY_*), it is full, the account is disabled (STUDENT_DISABLED,
      DOCTOR_DISABLED), the user has the wrong role (NOT_A_STUDENT, NOT_A_DOCTOR),
      or the record is in the wrong state (WRONG_STATE).

    OPEN DECISIONS
    - None in this file. Backend settings still to choose: file storage
      (faculty server) and the email service.

  license:
    name: Proprietary - EduSync graduation project
servers:
  - url: http://localhost:8080/api
    description: Local development

tags:
  - name: Auth
    description: Login, first-login password change, current user.
  - name: Admin - Users
    description: Admin creates and manages accounts.
  - name: Admin - Bulk Import
    description: Create many accounts or enrollments from one Excel file.
  - name: Academic Structure
    description: Programs, terms, courses, course offerings, rooms.
  - name: Enrollments & Groups
    description: Who studies what, which group they are in, who teaches the group.
  - name: Registration
    description: Students choose courses from their program plan; advisor approves, then admin accepts.
  - name: My Dashboard
    description: Lists the logged-in user needs to start any screen.
  - name: Attendance - Doctor
    description: Open a session, show the rotating QR, mark, finish, correct.
  - name: Attendance - Student
    description: Scan the QR and see my own attendance.
  - name: Attendance Warnings
    description: Optional automatic warnings when a student's absence passes a limit.
  - name: Course Materials
    description: Lecture files per course.
  - name: Grade Items
    description: Assessments of a course (midterm, quiz, assignment...).
  - name: Grades
    description: Marks per student and assessment, with change history.
  - name: Assignments & Submissions
    description: Students upload PDF solutions; doctors download them.
  - name: Grade Import
    description: Excel upload -> check -> preview -> approve.
  - name: Grade Send
    description: Review and email approved marks to students.
  - name: Control Export
    description: Excel file for the university control office.
  - name: Tickets
    description: Student requests about a course, answered with a decision.
  - name: Audit
    description: Read-only log of important actions.
  - name: AI Assistant
    description: Course chatbot (semester 2).
  - name: Files

    description: Download stored files (permission checked).
security:
  - bearerAuth: []

paths:
  # ================================================================ AUTH
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with university email and password
      operationId: postAuthLogin
      description: |
        Public endpoint (no token needed).
        If `mustChangePassword` is true, the frontend must open the
        "create new password" screen. Until the password is changed, every
        other endpoint answers 403 with code PASSWORD_CHANGE_REQUIRED.
        The only exceptions are POST /auth/change-password and GET /auth/me
        (the frontend needs /auth/me to restore the session on this screen).
        A DISABLED account gets 403 ACCOUNT_DISABLED (on login and on every later call).
      security: []
      x-roles: [PUBLIC]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoginResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change my password (required on first login)
      operationId: postAuthChangePassword
      description: |
        Checks the current (temporary) password, saves the hash of the new one,
        and sets must_change_password = false. Returns a fresh token.
        Errors: WRONG_PASSWORD, WEAK_PASSWORD, SAME_AS_OLD.
      x-roles: [STUDENT, DOCTOR, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChangePasswordRequest"}
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoginResponse"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the logged-in user
      operationId: getAuthMe
      description: |
        The frontend uses `roles` to decide which dashboard and menu to show.
        Also allowed while `mustChangePassword` is true (it is how the frontend
        restores the "create new password" screen after a page refresh).
      x-roles: [STUDENT, DOCTOR, ADMIN]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Ask for a password-reset email
      operationId: postAuthForgotPassword
      description: |
        Public. Always answers 202, even if the email is unknown (so nobody can
        check which emails exist). If the account exists, a PASSWORD_RESET_TOKEN
        is created (only its hash is stored, valid 30 minutes, single use) and a
        link with the token is emailed to the university address.
      security: []
      x-roles: [PUBLIC]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ForgotPasswordRequest"}
      responses:
        "202": {description: "If the email exists, a reset link was sent"}
        "429": {$ref: "#/components/responses/TooManyRequests"}

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password with the emailed token
      operationId: postAuthResetPassword
      description: |
        Public. Checks the token (exists, not expired, not used), saves the new
        password hash, marks the token used and sets must_change_password = false.
        Errors: INVALID_OR_EXPIRED_TOKEN, WEAK_PASSWORD.
      security: []
      x-roles: [PUBLIC]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResetPasswordRequest"}
      responses:
        "204": {description: "Password changed; the user can log in"}
        "400": {$ref: "#/components/responses/ValidationError"}

  # ======================================================= ADMIN - USERS
  /admin/users:
    get:
      tags: [Admin - Users]
      summary: List / search users
      operationId: getAdminUsers
      x-roles: [ADMIN]
      parameters:
        - {name: role, in: query, schema: {$ref: "#/components/schemas/Role"}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/UserStatus"}}
        - name: q
          in: query
          description: Search in name, email or university ID.
          schema: {type: string}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/Size"}
      responses:
        "200":
          description: One page of users
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserPage"}
        "403": {$ref: "#/components/responses/Forbidden"}
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Admin - Users]
      summary: Create an account
      operationId: postAdminUsers
      description: |
        Creates the user with a temporary password and must_change_password = true.
        The temporary password is returned ONCE so the admin can hand it over.
        Errors: EMAIL_TAKEN, UNIVERSITY_ID_TAKEN.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateUserRequest"}
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreateUserResponse"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "409": {$ref: "#/components/responses/Conflict"}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/users/{userId}:
    parameters:
      - {$ref: "#/components/parameters/UserId"}
    get:
      tags: [Admin - Users]
      summary: Get one user
      operationId: getAdminUsersByUserId
      x-roles: [ADMIN]
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "404": {$ref: "#/components/responses/NotFound"}
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Admin - Users]
      summary: Edit a user (name, email, roles, enable/disable)
      operationId: updateAdminUsersByUserId
      description: Send only the fields you want to change. Disabling never deletes data.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateUserRequest"}
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/users/{userId}/reset-password:
    post:
      tags: [Admin - Users]
      summary: Reset a forgotten password
      operationId: postAdminUsersByUserIdResetPassword
      description: Generates a new temporary password and sets must_change_password = true again.
      x-roles: [ADMIN]
      parameters:
        - {$ref: "#/components/parameters/UserId"}
      responses:
        "200":
          description: New temporary password (shown once)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TemporaryPassword"}
        "404": {$ref: "#/components/responses/NotFound"}
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =============================================== ADMIN - BULK IMPORT
  /admin/imports/users/template:
    get:
      tags: [Admin - Bulk Import]
      summary: Download the Excel template for new accounts
      operationId: getAdminImportsUsersTemplate
      description: "Columns: UniversityId | Email | FullName | FullNameAr | Role (STUDENT or DOCTOR)."
      x-roles: [ADMIN]
      responses:
        "200":
          description: Excel template
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /admin/imports/users:
    post:
      tags: [Admin - Bulk Import]
      summary: Import accounts from Excel (preview first, then commit)
      operationId: postAdminImportsUsers
      description: |
        Send the same file twice: first with mode=PREVIEW (nothing is saved, every
        row is checked), then with mode=COMMIT. COMMIT saves all rows or none: any
        error blocks the whole file, like the grade import.
        A row whose UniversityId already exists updates the name fields only.
        Every NEW account gets a temporary password (must_change_password = true),
        emailed to its university email, so no password list is ever shown.
        Row errors: MISSING_FIELD, INVALID_EMAIL, NOT_UNIVERSITY_EMAIL,
        DUPLICATE_IN_FILE, EMAIL_TAKEN, UNKNOWN_ROLE.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, mode]
              properties:
                file: {type: string, format: binary}
                mode: {$ref: "#/components/schemas/ImportMode"}
      responses:
        "200":
          description: Check result (PREVIEW) or what was saved (COMMIT)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BulkImportResult"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

  /admin/imports/enrollments/template:
    get:
      tags: [Admin - Bulk Import]
      summary: Download the Excel template for enrolling students in a course
      operationId: getAdminImportsEnrollmentsTemplate
      description: |
        Columns: UniversityId | ProgramCode | SeatNo | LectureGroup | LabGroup.
        Group columns hold a group label of this course (LabGroup empty if the
        course has no lab).
        Error: OFFERING_NOT_FOUND (404).
      x-roles: [ADMIN]
      parameters:
        - name: offeringId
          in: query
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200":
          description: Excel template
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

        "404": {$ref: "#/components/responses/NotFound"}
  /admin/imports/enrollments:
    post:
      tags: [Admin - Bulk Import]
      summary: Enroll many students in one course and put them in groups
      operationId: postAdminImportsEnrollments
      description: |
        Same PREVIEW / COMMIT flow as the account import. For each row it creates
        the ENROLLMENT (with program and seat number) and the GROUP_MEMBERSHIPs.
        Students already enrolled get their program, seat number and groups
        updated. All rows or none.
        Error: OFFERING_NOT_FOUND (404).
        Row errors: MISSING_FIELD, UNKNOWN_STUDENT, STUDENT_DISABLED, UNKNOWN_PROGRAM,
        UNKNOWN_GROUP, DUPLICATE_IN_FILE, DUPLICATE_SEAT_NO, OFFERING_FULL,
        ENROLLMENT_COMPLETED (a COMPLETED enrollment can't be changed),
        GROUP_PERIOD_CONFLICT (the student is already in another group of the same type).
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, mode, offeringId]
              properties:
                offeringId: {type: integer, format: int64}
                file: {type: string, format: binary}
                mode: {$ref: "#/components/schemas/ImportMode"}
      responses:
        "200":
          description: Check result (PREVIEW) or what was saved (COMMIT)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BulkImportResult"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

        "404": {$ref: "#/components/responses/NotFound"}
  # ================================================== ACADEMIC STRUCTURE
  /programs:
    get:
      tags: [Academic Structure]
      summary: List academic programs
      operationId: getPrograms
      x-roles: [STUDENT, DOCTOR, ADMIN]
      parameters:
        - {$ref: "#/components/parameters/ActiveOnly"}
      responses:
        "200":
          description: Programs
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Program"}
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Academic Structure]
      summary: Create a program
      description: |
        Errors: VALIDATION_ERROR (400), PROGRAM_CODE_EXISTS (409).
      operationId: postPrograms
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProgramInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Program"}
        "409": {$ref: "#/components/responses/Conflict"}
        '401':
          $ref: '#/components/responses/Unauthorized'

        "400": {$ref: "#/components/responses/ValidationError"}
  /programs/{programId}:
    patch:
      tags: [Academic Structure]
      summary: Edit or deactivate a program
      description: |
        Send only the fields you want to change. Deactivating never deletes data.
        Errors: PROGRAM_NOT_FOUND (404), VALIDATION_ERROR (400), PROGRAM_CODE_EXISTS (409).
      operationId: updateProgramsByProgramId
      x-roles: [ADMIN]
      parameters:
        - {$ref: "#/components/parameters/ProgramId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProgramInput"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Program"}
        "404": {$ref: "#/components/responses/NotFound"}
        '401':
          $ref: '#/components/responses/Unauthorized'

        "400": {$ref: "#/components/responses/ValidationError"}
        "409": {$ref: "#/components/responses/Conflict"}
  /terms:
    get:
      tags: [Academic Structure]
      summary: List academic terms
      operationId: getTerms
      x-roles: [STUDENT, DOCTOR, ADMIN]
      responses:
        "200":
          description: Terms, newest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Term"}
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Academic Structure]
      summary: Create a term
      description: |
        Unique rule: (academicYear, termType). endDate must not be before startDate.
        Errors: VALIDATION_ERROR (400), TERM_EXISTS (409).
      operationId: postTerms
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TermInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Term"}
        "400": {$ref: "#/components/responses/ValidationError"}
        '401':
          $ref: '#/components/responses/Unauthorized'

        "409": {$ref: "#/components/responses/Conflict"}
  /terms/{termId}:
    patch:
      tags: [Academic Structure]
      summary: Edit a term
      description: |
        Send only the fields you want to change.
        Errors: TERM_NOT_FOUND (404), VALIDATION_ERROR (400), TERM_EXISTS (409).
      operationId: updateTermsByTermId
      x-roles: [ADMIN]
      parameters:
        - {$ref: "#/components/parameters/TermId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TermInput"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Term"}
        "404": {$ref: "#/components/responses/NotFound"}
        '401':
          $ref: '#/components/responses/Unauthorized'

        "400": {$ref: "#/components/responses/ValidationError"}
        "409": {$ref: "#/components/responses/Conflict"}
  /courses:
    get:
      tags: [Academic Structure]
      summary: List courses (the catalog, not a specific semester)
      operationId: getCourses
      x-roles: [DOCTOR, ADMIN]
      parameters:
        - name: q
          in: query
          description: Search by code or title.
          schema: {type: string}
      responses:
        "200":
          description: Courses
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Course"}
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Academic Structure]
      summary: Create a course
      description: |
        creditHours must be at least 1.
        Errors: VALIDATION_ERROR (400), COURSE_CODE_EXISTS (409).
      operationId: postCourses
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CourseInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Course"}
        "409": {$ref: "#/components/responses/Conflict"}
        '401':
          $ref: '#/components/responses/Unauthorized'

        "400": {$ref: "#/components/responses/ValidationError"}
  /courses/{courseId}:
    patch:
      tags: [Academic Structure]
      summary: Edit a course
      description: |
        Send only the fields you want to change.
        Errors: COURSE_NOT_FOUND (404), VALIDATION_ERROR (400), COURSE_CODE_EXISTS (409).
      operationId: updateCoursesByCourseId
      x-roles: [ADMIN]
      parameters:
        - {$ref: "#/components/parameters/CourseId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CourseInput"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Course"}
        "404": {$ref: "#/components/responses/NotFound"}
        '401':
          $ref: '#/components/responses/Unauthorized'

        "400": {$ref: "#/components/responses/ValidationError"}
        "409": {$ref: "#/components/responses/Conflict"}
  /offerings:
    get:
      tags: [Academic Structure]
      summary: List course offerings (a course given in a specific term and section)
      operationId: getOfferings
      x-roles: [ADMIN]
      parameters:
        - {name: termId, in: query, schema: {type: integer, format: int64}}
        - {name: courseId, in: query, schema: {type: integer, format: int64}}
      responses:
        "200":
          description: Offerings
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Offering"}
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Academic Structure]
      summary: Open a course in a term
      operationId: postOfferings
      description: |
        Unique rule: (course, term, section). An empty section also counts only once.
        Errors: COURSE_NOT_FOUND (404), TERM_NOT_FOUND (404), VALIDATION_ERROR (400),
        OFFERING_EXISTS (409).
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OfferingInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Offering"}
        "409": {$ref: "#/components/responses/Conflict"}
        '401':
          $ref: '#/components/responses/Unauthorized'

        "400": {$ref: "#/components/responses/ValidationError"}
        "404": {$ref: "#/components/responses/NotFound"}
  /offerings/{offeringId}:
    parameters:
      - {$ref: "#/components/parameters/OfferingId"}
    get:
      tags: [Academic Structure]
      summary: Get one offering
      operationId: getOfferingsByOfferingId
      description: |
        Students may read it only if enrolled; doctors only if they teach one of its groups.
        Error: OFFERING_NOT_FOUND (404), also when the offering is not visible to you.
      x-roles: [STUDENT, DOCTOR, ADMIN]
      responses:
        "200":
          description: Offering
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Offering"}
        "404": {$ref: "#/components/responses/NotFound"}
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Academic Structure]
      summary: Edit an offering (capacity, coursework maximum, section)
      description: |
        Send only the fields you want to change.
        Errors: OFFERING_NOT_FOUND (404), VALIDATION_ERROR (400), OFFERING_EXISTS (409).
      operationId: updateOfferingsByOfferingId
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OfferingUpdate"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Offering"}
        "404": {$ref: "#/components/responses/NotFound"}
        '401':
          $ref: '#/components/responses/Unauthorized'

        "400": {$ref: "#/components/responses/ValidationError"}
        "409": {$ref: "#/components/responses/Conflict"}
  /rooms:
    get:
      tags: [Academic Structure]
      summary: List rooms (with their network profile)
      operationId: getRooms
      description: A room is only a physical place. It does not decide the attendance method.
      x-roles: [DOCTOR, ADMIN]
      responses:
        "200":
          description: Rooms
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Room"}
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Academic Structure]
      summary: Add a room
      description: |
        Network profile: LOCAL_ROUTER rooms need ssid and routerMac; CAMPUS_WIFI rooms
        need subnet. The fields of the other mode are cleared.
        Errors: VALIDATION_ERROR (400), ROOM_CODE_EXISTS (409).
      operationId: postRooms
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RoomInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Room"}
        "409": {$ref: "#/components/responses/Conflict"}
        '401':
          $ref: '#/components/responses/Unauthorized'

        "400": {$ref: "#/components/responses/ValidationError"}
  /rooms/{roomId}:
    patch:
      tags: [Academic Structure]
      summary: Edit a room or its network profile
      description: |
        Send only the fields you want to change. The network rules of POST /rooms apply
        to the result.
        Errors: ROOM_NOT_FOUND (404), VALIDATION_ERROR (400), ROOM_CODE_EXISTS (409).
      operationId: patchRoomsByRoomId
      x-roles: [ADMIN]
      parameters:
        - {$ref: "#/components/parameters/RoomId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RoomUpdate"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Room"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

        "409": {$ref: "#/components/responses/Conflict"}
  # ================================================ ENROLLMENTS & GROUPS
  /offerings/{offeringId}/enrollments:
    parameters:
      - {$ref: "#/components/parameters/OfferingId"}
    get:
      tags: [Enrollments & Groups]
      summary: Students enrolled in an offering
      description: |
        A doctor sees only courses they teach.
        Errors: OFFERING_NOT_FOUND (404), NOT_YOUR_COURSE (403), VALIDATION_ERROR (400, unknown status).
      operationId: getOfferingsByOfferingIdEnrollments
      x-roles: [DOCTOR, ADMIN]
      parameters:
        - {name: programId, in: query, schema: {type: integer, format: int64}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/EnrollmentStatus"}}
      responses:
        "200":
          description: Enrollments
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Enrollment"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        "400": {$ref: "#/components/responses/ValidationError"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Enrollments & Groups]
      summary: Enroll a student in the offering
      operationId: postOfferingsByOfferingIdEnrollments
      description: |
        Unique rule: (student, offering). A DISABLED student can't be enrolled.
        Errors: OFFERING_NOT_FOUND (404), USER_NOT_FOUND (404), PROGRAM_NOT_FOUND (404),
        NOT_A_STUDENT (409), STUDENT_DISABLED (409), ALREADY_ENROLLED (409), OFFERING_FULL (409).
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EnrollmentInput"}
      responses:
        "201":
          description: Enrolled
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Enrollment"}
        "409": {$ref: "#/components/responses/Conflict"}
        '401':
          $ref: '#/components/responses/Unauthorized'

        "400": {$ref: "#/components/responses/ValidationError"}
        "404": {$ref: "#/components/responses/NotFound"}
  /enrollments/{enrollmentId}:
    patch:
      tags: [Enrollments & Groups]
      summary: Change an enrollment (status or program)
      operationId: updateEnrollmentsByEnrollmentId
      description: |
        Withdrawing keeps all history (attendance, marks). Nothing is deleted.
        Setting the status back to ACTIVE re-checks the student and the seats.
        Errors: ENROLLMENT_NOT_FOUND (404), PROGRAM_NOT_FOUND (404), VALIDATION_ERROR (400),
        STUDENT_DISABLED (409), OFFERING_FULL (409).
      x-roles: [ADMIN]
      parameters:
        - {$ref: "#/components/parameters/EnrollmentId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EnrollmentUpdate"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Enrollment"}
        "404": {$ref: "#/components/responses/NotFound"}
        '401':
          $ref: '#/components/responses/Unauthorized'

        "400": {$ref: "#/components/responses/ValidationError"}
        "409": {$ref: "#/components/responses/Conflict"}
  /offerings/{offeringId}/groups:
    parameters:
      - {$ref: "#/components/parameters/OfferingId"}
    get:
      tags: [Enrollments & Groups]
      summary: Groups of an offering (lecture and practical groups)
      description: |
        A doctor sees only courses they teach.
        Errors: OFFERING_NOT_FOUND (404), NOT_YOUR_COURSE (403).
      operationId: getOfferingsByOfferingIdGroups
      x-roles: [DOCTOR, ADMIN]
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Group"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Enrollments & Groups]
      summary: Create a group (lecture or lab)
      description: |
        The course's doctor (or an admin) manages groups. A doctor must already teach
        a group of this course, so the FIRST group of a new offering is always created
        by an admin, who then assigns its doctor (POST /groups/{groupId}/teaching-assignments).
        After that, the doctor can create the other groups.
        Unique rule: (offering, groupType, label).
        Errors: OFFERING_NOT_FOUND (404), NOT_YOUR_COURSE (403), VALIDATION_ERROR (400),
        GROUP_EXISTS (409).
      operationId: postOfferingsByOfferingIdGroups
      x-roles: [DOCTOR, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GroupInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Group"}
        "409": {$ref: "#/components/responses/Conflict"}
        '401':
          $ref: '#/components/responses/Unauthorized'

        "400": {$ref: "#/components/responses/ValidationError"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /groups/{groupId}:
    patch:
      tags: [Enrollments & Groups]
      summary: Rename a group
      description: |
        Rename a group, or change its type, day or time. Send only what changes.
        Errors: GROUP_NOT_FOUND (404), NOT_YOUR_COURSE (403), VALIDATION_ERROR (400),
        GROUP_EXISTS (409), ALREADY_MEMBER (409, a member would end up in two groups of the same type).
      operationId: updateGroupsByGroupId
      x-roles: [DOCTOR, ADMIN]
      parameters:
        - {$ref: "#/components/parameters/GroupId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GroupInput"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Group"}
        "404": {$ref: "#/components/responses/NotFound"}
        '401':
          $ref: '#/components/responses/Unauthorized'

        "400": {$ref: "#/components/responses/ValidationError"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /groups/{groupId}/members:
    parameters:
      - {$ref: "#/components/parameters/GroupId"}
    get:
      tags: [Enrollments & Groups]
      summary: Students in a group
      operationId: getGroupsByGroupIdMembers
      description: |
        By default only current members. `at` shows the members on a past date.
        Errors: GROUP_NOT_FOUND (404), NOT_YOUR_COURSE (403).
      x-roles: [DOCTOR, ADMIN]
      parameters:
        - name: at
          in: query
          schema: {type: string, format: date}
      responses:
        "200":
          description: Memberships
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/GroupMembership"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Enrollments & Groups]
      summary: Put a student in a group
      operationId: postGroupsByGroupIdMembers
      description: |
        The enrollment must belong to the same offering as the group.
        A student can be in only one current group of each type (lecture / lab) per course.
        To MOVE a student, end the old membership (PATCH) and add a new one,
        so the history of which group they were in is kept. A student who left a group
        can join it again later.
        Errors: GROUP_NOT_FOUND (404), ENROLLMENT_NOT_FOUND (404), NOT_YOUR_COURSE (403),
        VALIDATION_ERROR (400), WRONG_OFFERING (409), ALREADY_MEMBER (409).
      x-roles: [DOCTOR, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MembershipInput"}
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GroupMembership"}
        "409": {$ref: "#/components/responses/Conflict"}
        '401':
          $ref: '#/components/responses/Unauthorized'

        "400": {$ref: "#/components/responses/ValidationError"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /group-memberships/{membershipId}:
    patch:
      tags: [Enrollments & Groups]
      summary: End a membership (student leaves the group)
      description: |
        endsAt must be after startsAt. The membership stays in history; it is not deleted.
        Errors: MEMBERSHIP_NOT_FOUND (404), NOT_YOUR_COURSE (403), VALIDATION_ERROR (400),
        ALREADY_MEMBER (409).
      operationId: updateGroupMembershipsByMembershipId
      x-roles: [DOCTOR, ADMIN]
      parameters:
        - {$ref: "#/components/parameters/MembershipId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EndPeriodRequest"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GroupMembership"}
        "404": {$ref: "#/components/responses/NotFound"}
        '401':
          $ref: '#/components/responses/Unauthorized'

        "400": {$ref: "#/components/responses/ValidationError"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /groups/{groupId}/teaching-assignments:
    parameters:
      - {$ref: "#/components/parameters/GroupId"}
    get:
      tags: [Enrollments & Groups]
      summary: Doctors who teach (or taught) a group
      operationId: getGroupsByGroupIdTeachingAssignments
      description: |
        A doctor may read assignments only for a course they teach.
        Errors: GROUP_NOT_FOUND (404), NOT_YOUR_COURSE (403).
      x-roles: [DOCTOR, ADMIN]
      responses:
        "200":
          description: Teaching assignments
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/TeachingAssignment"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [Enrollments & Groups]
      summary: Assign a doctor to teach a group
      operationId: postGroupsByGroupIdTeachingAssignments
      description: |
        Only an admin assigns doctors. Assigning a doctor to a group of an offering
        is what lets that doctor manage the offering's groups.
        The user must be ACTIVE and have the DOCTOR role.
        Errors: GROUP_NOT_FOUND (404), USER_NOT_FOUND (404), NOT_A_DOCTOR (409),
        DOCTOR_DISABLED (409), ALREADY_ASSIGNED (409).
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TeachingAssignmentInput"}
      responses:
        "201":
          description: Assigned
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TeachingAssignment"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /teaching-assignments/{assignmentId}:
    patch:
      tags: [Enrollments & Groups]
      summary: End a teaching assignment (doctor stops teaching the group)
      operationId: updateTeachingAssignmentsByAssignmentId
      description: |
        endsAt must be after startsAt. The assignment remains in history; it is not deleted.
        Errors: ASSIGNMENT_NOT_FOUND (404), VALIDATION_ERROR (400).
      x-roles: [ADMIN]
      parameters:
        - {$ref: "#/components/parameters/TeachingAssignmentId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EndPeriodRequest"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TeachingAssignment"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  # ======================================================== REGISTRATION
  /admin/students/{userId}/profile:
    parameters:
      - {$ref: "#/components/parameters/UserId"}
    get:
      tags: [Registration]
      summary: A student's academic profile (program, level, credit limit, advisor)
      description: |
        Errors: USER_NOT_FOUND (404), PROFILE_NOT_FOUND (404).
      operationId: getAdminStudentsByUserIdProfile
      x-roles: [ADMIN]
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudentProfile"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [Registration]
      summary: Set a student's program, level, max credit hours and advisor
      operationId: putAdminStudentsByUserIdProfile
      description: |
        The user must be a STUDENT. The advisor must be an ACTIVE user with the DOCTOR role.
        Errors: USER_NOT_FOUND (404), PROGRAM_NOT_FOUND (404), VALIDATION_ERROR (400),
        NOT_A_STUDENT (409), NOT_A_DOCTOR (409), DOCTOR_DISABLED (409).
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StudentProfileInput"}
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StudentProfile"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}

        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /programs/{programId}/plan-courses:
    parameters:
      - {$ref: "#/components/parameters/ProgramId"}
    get:
      tags: [Registration]
      summary: The program's study plan (which courses each level takes in each term)
      description: |
        Errors: PROGRAM_NOT_FOUND (404), VALIDATION_ERROR (400, unknown termType).
      operationId: getProgramsByProgramIdPlanCourses
      x-roles: [STUDENT, DOCTOR, ADMIN]
      parameters:
        - {name: level, in: query, schema: {type: integer, minimum: 1}}
        - {name: termType, in: query, schema: {$ref: "#/components/schemas/TermType"}}
      responses:
        "200":
          description: Plan courses
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/PlanCourse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [Registration]
      summary: Add a course to the program plan
      operationId: postProgramsByProgramIdPlanCourses
      description: |
        Unique rule: (program, level, termType, course).
        Errors: PROGRAM_NOT_FOUND (404), COURSE_NOT_FOUND (404), VALIDATION_ERROR (400),
        ALREADY_IN_PLAN (409).
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlanCourseInput"}
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlanCourse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}

        "400": {$ref: "#/components/responses/ValidationError"}
        "404": {$ref: "#/components/responses/NotFound"}
  /plan-courses/{planCourseId}:
    delete:
      tags: [Registration]
      summary: Remove a course from the program plan
      description: |
        Error: PLAN_COURSE_NOT_FOUND (404).
      operationId: deletePlanCoursesByPlanCourseId
      x-roles: [ADMIN]
      parameters:
        - {$ref: "#/components/parameters/PlanCourseId"}
      responses:
        "204": {description: Removed}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /me/registration/available:
    get:
      tags: [Registration]
      summary: Courses I can register this term
      operationId: getMeRegistrationAvailable
      description: |
        Offerings of the term whose course is in MY program plan for MY level and
        this term's type (Fall/Spring/Summer), with seats, credits and schedule.
        Errors: TERM_NOT_FOUND (404), PROFILE_INCOMPLETE (409, my program, level or
        credit limit is not set yet).
      x-roles: [STUDENT]
      parameters:
        - {$ref: "#/components/parameters/TermIdQuery"}
      responses:
        "200":
          description: Available offerings
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AvailableOffering"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}

        "404": {$ref: "#/components/responses/NotFound"}
  /me/registration:
    get:
      tags: [Registration]
      summary: My registration request for a term
      description: |
        Error: TERM_NOT_FOUND (404).
      operationId: getMeRegistration
      x-roles: [STUDENT]
      parameters:
        - {$ref: "#/components/parameters/TermIdQuery"}
      responses:
        "200":
          description: My request (status DRAFT if not submitted yet)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegistrationRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [Registration]
      summary: Save my chosen courses (draft)
      operationId: putMeRegistration
      description: |
        Replaces the list of chosen offerings. Allowed while DRAFT or RETURNED.
        Checked: each offering is available to me, no two sections of the same
        course, no schedule clash, total credits <= my max_credit_hours, seats left.
        Errors: TERM_NOT_FOUND (404), VALIDATION_ERROR (400), PROFILE_INCOMPLETE (409),
        ALREADY_SUBMITTED (409), NOT_AVAILABLE (409), ALREADY_ENROLLED (409),
        SAME_COURSE_TWICE (409), CREDIT_LIMIT_EXCEEDED (409), SCHEDULE_CLASH (409),
        OFFERING_FULL (409).
      x-roles: [STUDENT]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveRegistrationRequest"}
      responses:
        "200":
          description: Saved draft
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegistrationRequest"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}

        "404": {$ref: "#/components/responses/NotFound"}
  /me/registration/submit:
    post:
      tags: [Registration]
      summary: Submit my registration to my advisor
      operationId: postMeRegistrationSubmit
      description: |
        Status DRAFT/RETURNED -> SUBMITTED. The advisor is emailed.
        All the checks of PUT /me/registration run again.
        Errors: TERM_NOT_FOUND (404), PROFILE_INCOMPLETE (409), ALREADY_SUBMITTED (409),
        EMPTY_REQUEST (409), NO_ADVISOR (409), ADVISOR_DISABLED (409), plus the errors
        of PUT /me/registration.
      x-roles: [STUDENT]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [termId]
              properties:
                termId: {type: integer, format: int64}
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegistrationRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}

        "404": {$ref: "#/components/responses/NotFound"}
  /advisor/registrations:
    get:
      tags: [Registration]
      summary: Registration requests of my advisees (advisor doctor)
      operationId: getAdvisorRegistrations
      x-roles: [DOCTOR]
      parameters:
        - {name: termId, in: query, schema: {type: integer, format: int64}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/RegistrationStatus"}}
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/RegistrationRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /admin/registrations:
    get:
      tags: [Registration]
      summary: Registration requests waiting for final acceptance
      operationId: getAdminRegistrations
      x-roles: [ADMIN]
      parameters:
        - {name: termId, in: query, schema: {type: integer, format: int64}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/RegistrationStatus"}}
        - {name: programId, in: query, schema: {type: integer, format: int64}}
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/RegistrationRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /registrations/{requestId}:
    get:
      tags: [Registration]
      summary: One registration request
      operationId: getRegistrationsByRequestId
      description: |
        The student, their advisor and admins can read it. The advisor can't see a DRAFT.
        Error: REQUEST_NOT_FOUND (404), also when you may not see it.
      x-roles: [STUDENT, DOCTOR, ADMIN]
      parameters:
        - {$ref: "#/components/parameters/RequestId"}
      responses:
        "200":
          description: Request with its courses
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegistrationRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /registrations/{requestId}/advisor-decision:
    post:
      tags: [Registration]
      summary: Advisor approves or returns the request
      operationId: postRegistrationsByRequestIdAdvisorDecision
      description: |
        Only the student's advisor, only when SUBMITTED.
        APPROVE -> ADVISOR_APPROVED (goes to the admin). RETURN -> RETURNED (the
        student edits and submits again); a note is required when returning.
        Errors: REQUEST_NOT_FOUND (404), NOT_YOUR_ADVISEE (403), VALIDATION_ERROR (400),
        WRONG_STATE (409).
      x-roles: [DOCTOR]
      parameters:
        - {$ref: "#/components/parameters/RequestId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegistrationDecision"}
      responses:
        "200":
          description: Decision saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegistrationRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

        "400": {$ref: "#/components/responses/ValidationError"}
        "404": {$ref: "#/components/responses/NotFound"}
  /registrations/{requestId}/admin-decision:
    post:
      tags: [Registration]
      summary: Admin gives final acceptance (creates the enrollments)
      operationId: postRegistrationsByRequestIdAdminDecision
      description: |
        Only when ADVISOR_APPROVED. APPROVE -> APPROVED: one ENROLLMENT (status
        ACTIVE, program from the student profile) is created per chosen offering,
        seats are re-checked. RETURN -> RETURNED with a note. The student is emailed.
        Seat numbers and groups are set afterwards (enrollment import or group screens).
        Errors: REQUEST_NOT_FOUND (404), VALIDATION_ERROR (400), WRONG_STATE (409),
        EMPTY_REQUEST (409), STUDENT_DISABLED (409), PROFILE_INCOMPLETE (409),
        ALREADY_ENROLLED (409), OFFERING_FULL (409), plus the checks of PUT /me/registration.
      x-roles: [ADMIN]
      parameters:
        - {$ref: "#/components/parameters/RequestId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegistrationDecision"}
      responses:
        "200":
          description: Decision saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegistrationRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}

        "400": {$ref: "#/components/responses/ValidationError"}
        "404": {$ref: "#/components/responses/NotFound"}
  # ======================================================== MY DASHBOARD
  /admin/stats:
