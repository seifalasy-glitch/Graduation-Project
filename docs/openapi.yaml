      operationId: getAdminStats
      x-roles: [ADMIN]
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminStats"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /me/teaching-summary:
    get:
      tags: [My Dashboard]
      summary: Numbers for the doctor home page
      operationId: getMeTeachingSummary
      description: Only real EduSync data for the courses I teach this term.
      x-roles: [DOCTOR]
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TeachingSummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /me/upcoming:
    get:
      tags: [My Dashboard]
